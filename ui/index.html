<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NER Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">
  
  <!-- Navbar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center gap-3">
        <div class="w-3 h-8 bg-indigo-600 rounded-full"></div>
        <div>
          <h1 class="text-xl font-bold text-slate-900">NER Workspace</h1>
          <p class="text-xs text-slate-500">Named Entity Recognition Tester</p>
        </div>
      </div>
      <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-lg border border-slate-200">
        <span id="status-badge" class="px-2.5 py-1 text-xs font-semibold rounded-md bg-slate-200 text-slate-600">Standby</span>
        <input id="api-url" type="text" value="http://localhost:8000/extract-entities" class="bg-white px-3 py-1 text-sm rounded border border-slate-300 w-64 focus:outline-none focus:border-indigo-500" />
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-6xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Panel Kiri: Input -->
    <div class="lg:col-span-5 flex flex-col gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-3">
          <label class="font-semibold text-sm text-slate-700">Input Teks Artikel</label>
          <button onclick="loadSample()" class="text-xs text-indigo-600 hover:text-indigo-800 font-medium">+ Gunakan Contoh Teks</button>
        </div>
        <textarea id="article-input" rows="10" placeholder="Masukkan artikel di sini..." class="w-full p-3 text-sm bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        <button id="btn-submit" onclick="analyzeArticle()" class="mt-4 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-4 rounded-lg shadow-sm transition">Analisis Entitas (NER)</button>
      </div>

      <!-- JSON Log -->
      <div class="bg-slate-900 text-slate-100 p-4 rounded-xl shadow-sm text-xs font-mono">
        <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-2">
          <span class="text-slate-400 font-sans font-semibold">Raw JSON Response</span>
          <span id="response-time" class="text-emerald-400"></span>
        </div>
        <pre id="raw-json" class="overflow-x-auto max-h-60 text-slate-300">Menunggu request ke API...</pre>
      </div>
    </div>

    <!-- Panel Kanan: Output -->
    <div class="lg:col-span-7 flex flex-col gap-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <h2 class="font-semibold text-sm text-slate-700 mb-3">Highlighted Text</h2>
        <div id="highlighted-output" class="p-4 bg-slate-50 rounded-lg border border-slate-200 min-h-[180px] text-sm leading-relaxed whitespace-pre-wrap text-slate-600">Hasil ekstraksi entitas akan muncul di sini.</div>
      </div>

      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-semibold text-sm text-slate-700">Entity Table</h2>
          <span id="entity-count" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full font-semibold">0 Entitas</span>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="border-b border-slate-200 text-xs text-slate-500 uppercase">
                <th class="py-2 px-3">Teks Entitas</th>
                <th class="py-2 px-3">Label</th>
              </tr>
            </thead>
            <tbody id="entity-table-body" class="divide-y divide-slate-100 text-slate-700">
              <tr><td colspan="2" class="py-6 text-center text-slate-400 text-xs">Belum ada data</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Styling warna label
    const labelColors = {
      PERSON: "bg-blue-100 text-blue-800 border-blue-300",
      ORG: "bg-emerald-100 text-emerald-800 border-emerald-300",
      LOC: "bg-amber-100 text-amber-800 border-amber-300",
      GPE: "bg-amber-100 text-amber-800 border-amber-300",
      DATE: "bg-purple-100 text-purple-800 border-purple-300",
      DEFAULT: "bg-indigo-100 text-indigo-800 border-indigo-300"
    };

    function loadSample() {
      document.getElementById("article-input").value = "Joko Widodo, Presiden Republik Indonesia, menghadiri Konferensi Tingkat Tinggi G20 yang diselenggarakan di Bali pada bulan November 2022. Bank Indonesia mencatat pertumbuhan ekonomi yang positif dengan investasi mencapai Rp 150 Triliun dari perusahaan global seperti Microsoft dan Google.";
    }

    async function analyzeArticle() {
      const apiUrl = document.getElementById("api-url").value.trim();
      const text = document.getElementById("article-input").value;
      const btn = document.getElementById("btn-submit");
      const rawJsonEl = document.getElementById("raw-json");
      const timeEl = document.getElementById("response-time");
      const badge = document.getElementById("status-badge");

      if (!text.trim()) {
        alert("Masukkan teks artikel terlebih dahulu!");
        return;
      }

      btn.disabled = true;
      btn.innerHTML = "Memproses...";
      badge.textContent = "Mengecek...";
      badge.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-amber-100 text-amber-700";
      
      const startTime = performance.now();

      try {
        // Payload disesuaikan persis dengan skema ArticleRequest milikmu
        const payload = { 
            title: "Testing API", 
            body: text,
            model_type: "adapted" 
        };
        
        const response = await fetch(apiUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const endTime = performance.now();
        timeEl.textContent = `${Math.round(endTime - startTime)} ms (HTTP ${response.status})`;

        const data = await response.json();
        rawJsonEl.textContent = JSON.stringify(data, null, 2);

        if (response.ok) {
          badge.textContent = "API Online";
          badge.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-emerald-100 text-emerald-700";
          const entities = data.entities || [];
          renderResults(text, entities);
        } else {
          badge.textContent = "Error HTTP " + response.status;
          badge.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-rose-100 text-rose-700";
        }
      } catch (error) {
        rawJsonEl.textContent = "Error: " + error.message + "\n\nPastikan backend uvicorn menyala dan CORS sudah dikonfigurasi.";
        badge.textContent = "Gagal Terhubung";
        badge.className = "px-2.5 py-1 text-xs font-semibold rounded-md bg-rose-100 text-rose-700";
      } finally {
        btn.disabled = false;
        btn.innerHTML = "Analisis Entitas (NER)";
      }
    }

    function renderResults(text, entities) {
      const tableBody = document.getElementById("entity-table-body");
      const highlightBox = document.getElementById("highlighted-output");
      document.getElementById("entity-count").textContent = `${entities.length} Entitas`;

      if (entities.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="2" class="py-6 text-center text-slate-400 text-xs">Tidak ada entitas yang terdeteksi</td></tr>';
        highlightBox.textContent = text;
        return;
      }

      // Render Tabel
      tableBody.innerHTML = entities.map(ent => {
        const entText = ent.text || ent.word || "-";
        const label = ent.label || ent.entity_group || "ENT";
        const colorClass = labelColors[label.toUpperCase()] || labelColors.DEFAULT;
        return `
          <tr class="hover:bg-slate-50">
            <td class="py-2.5 px-3 font-medium text-slate-900">${escapeHtml(entText)}</td>
            <td class="py-2.5 px-3"><span class="px-2 py-0.5 text-xs font-bold rounded border ${colorClass}">${escapeHtml(label)}</span></td>
          </tr>`;
      }).join("");

      // Render Highlight (Berdasarkan index karakter dari SpaCy)
      const hasOffsets = entities.every(e => typeof e.start === "number" && typeof e.end === "number");
      if (hasOffsets) {
        const sorted = [...entities].sort((a, b) => a.start - b.start);
        let resultHtml = "";
        let lastIdx = 0;

        sorted.forEach(ent => {
          if (ent.start >= lastIdx) {
            resultHtml += escapeHtml(text.slice(lastIdx, ent.start));
            const label = ent.label || ent.entity_group || "ENT";
            const colorClass = labelColors[label.toUpperCase()] || labelColors.DEFAULT;
            resultHtml += `<mark class="px-1.5 py-0.5 mx-0.5 rounded border font-medium ${colorClass}">${escapeHtml(text.slice(ent.start, ent.end))} <span class="text-[10px] font-bold opacity-75 uppercase">${escapeHtml(label)}</span></mark>`;
            lastIdx = ent.end;
          }
        });
        resultHtml += escapeHtml(text.slice(lastIdx));
        highlightBox.innerHTML = resultHtml;
      } else {
        highlightBox.textContent = text;
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }
  </script>
</body>
</html>
